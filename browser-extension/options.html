<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Recipe App Capture settings</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <h1>Recipe App Capture</h1>
    <form id="form">
        <label for="app-url">Recipe App address</label>
        <input id="app-url" type="url" required spellcheck="false">
        <p class="hint">The address you open the app at, e.g. <span id="default-url"></span></p>
        <button type="submit">Save and test</button>
    </form>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <script type="module" src="options.js"></script>
</body>
</html>
