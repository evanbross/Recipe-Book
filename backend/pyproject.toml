[project]
name = "recipe-app-backend"
version = "0.1.0"
description = "Capture and organize recipes from web pages, photos, and scans."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn>=0.34.0",
    "sqlalchemy>=2.0.40",
    "alembic>=1.15.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.1.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.13.4",
    "anthropic>=0.125.0,<1",  # 0.125 adds server-side refusal `fallbacks`; 1.x is a separate migration
    "boto3>=1.37.38",
    "Pillow>=12.2.0",
    "python-multipart>=0.0.20",
    "google-auth>=2.36.0",
    "google-auth-oauthlib>=1.2.0",
    "google-api-python-client>=2.164.0",
    "psycopg2-binary>=2.9.10",
]

[dependency-groups]
dev = [
    # Shared dev-runner + dev-Caddy helpers from ../infra (local dev only; Docker
    # builds and exported requirements use --no-dev, so they never need ../infra).
    "zt-devkit",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ai: claude-opus-5-5 | 2026-11-13
# Put backend/ on sys.path so a bare `pytest` resolves `app` like `python -m pytest` does.
pythonpath = ["."]
norecursedirs = ["tmp", ".venv", "backups", "__pycache__"]

[tool.uv]
link-mode = "symlink"

[tool.uv.sources]
zt-devkit = { path = "../../infra/devkit", editable = true }
