[package]
name = "recipe-box-rust"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Smaller, slightly slower-to-compile release binary -- fine for a learning
# project's container image; drop this section if iteration speed matters more.
strip = true
lto = true
